[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "nitro-xml"
version = "0.1.0"
description = "Python bindings for Nitro XML (.xlsx, .docx, .pptx) via Rust/PyO3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.maturin]
manifest-path = "../rs/crates/nitro-xml-py/Cargo.toml"
module-name = "nitro_xml._native"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
