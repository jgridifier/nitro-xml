[package]
name = "nitro-xml-py"
description = "Python bindings for Nitro XML (maturin / PyO3)"
version = "0.1.0"
edition.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
nitro-xml-xlsx = { path = "../nitro-xml-xlsx" }
nitro-xml-docx = { path = "../nitro-xml-docx" }
nitro-xml-pptx = { path = "../nitro-xml-pptx" }
serde_json = "1"
