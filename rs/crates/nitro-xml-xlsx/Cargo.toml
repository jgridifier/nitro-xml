[package]
name = "nitro-xml-xlsx"
description = "Nitro XML .xlsx model (port of ChristopherVR/ooxml)"
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
nitro-xml-opc.workspace = true
nitro-xml-render.workspace = true
quick-xml = "0.41"
memchr = "2"
regex = "1"
serde_json = "1"
ryu = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "xlsx_dump"
path = "examples/xlsx_dump.rs"

[[example]]
name = "xlsx_view_ir_dump"
path = "examples/xlsx_view_ir_dump.rs"

[[example]]
name = "xlsx_formula_dump"
path = "examples/xlsx_formula_dump.rs"

[[example]]
name = "xlsx_calc_dump"
path = "examples/xlsx_calc_dump.rs"

[[example]]
name = "xlsx_save"
path = "examples/xlsx_save.rs"

[[example]]
name = "xlsx_fns_dump"
path = "examples/xlsx_fns_dump.rs"

[[example]]
name = "xlsx_editor_recalc"
path = "examples/xlsx_editor_recalc.rs"

[[example]]
name = "xlsx_paint_bench"
path = "examples/xlsx_paint_bench.rs"
