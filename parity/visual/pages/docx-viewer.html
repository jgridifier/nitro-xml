<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>nitro-xml docx viewer host</title>
  <link rel="stylesheet" href="/fonts/visual-fonts.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #stage {
      position: relative;
      overflow: auto;
      background: #fff;
      font-family: "Liberation Sans", Arial, sans-serif;
    }
    #stage nitro-docx {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100%;
    }
    #stage .dve-print-pages {
      margin: 0 auto;
    }
    @media print {
      html, body, #stage { background: #fff; }
      @page { margin: 0; }
    }
  </style>
</head>
<body>
  <div id="stage" data-ready="0"></div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const side = params.get('side'); // ts = upstream Print Layout, rust = nitro-docx
    const id = params.get('id');
    const fixture = params.get('fixture');
    const width = Number(params.get('width') || 800);
    const height = Number(params.get('height') || 600);
    const stage = document.getElementById('stage');
    stage.style.width = `${width}px`;
    stage.style.height = `${height}px`;

    function waitFrames(n = 2) {
      return new Promise((resolve) => {
        let left = n;
        const step = () => {
          left -= 1;
          if (left <= 0) resolve();
          else requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    async function waitFonts() {
      if (document.fonts?.ready) await document.fonts.ready;
      try {
        await Promise.all([
          document.fonts.load('12pt "Liberation Sans"'),
          document.fonts.load('bold 12pt "Liberation Sans"'),
          document.fonts.load('12pt Calibri'),
          document.fonts.load('12pt Arial'),
          document.fonts.load('12pt "Segoe UI"'),
        ]);
      } catch {
        /* ignore */
      }
    }

    function injectStyle(root, cssText, id) {
      if (!root) return;
      let el = root.querySelector(`style[data-visual="${id}"]`);
      if (!el) {
        el = document.createElement('style');
        el.dataset.visual = id;
        root.appendChild(el);
      }
      el.textContent = cssText;
    }

    function hideShellChrome(root) {
      if (!root) return;
      for (const sel of [
        '.chrome',
        '[part="sheet-tabs"]',
        '[part="status-bar"]',
        '.xve-tabs-row',
        '.xve-status',
        '.xve-title-bar',
        '.xve-ribbon',
        'office-ui-title-bar',
        'office-ui-status-bar',
      ]) {
        root.querySelectorAll(sel).forEach((node) => {
          node.style.display = 'none';
        });
      }
      const v = root.querySelector('.v');
      if (v) {
        v.style.flex = '1 1 auto';
        v.style.minHeight = '0';
        v.style.height = '100%';
      }
    }

    async function mountRust() {
      const { defineNitroDocx, initCore } = await import('/repo/packages/nitro-xml/loader/index.js');
      const fontMirror = new URL('/out/fonts/css2', location.origin).href;
      await initCore({ fontSource: fontMirror });
      defineNitroDocx();
      const el = document.createElement('nitro-docx');
      el.setAttribute('readonly', '');
      stage.appendChild(el);
      el.style.width = '100%';
      el.style.minHeight = '100%';
      await el.loadUrl(fixture);
      const shadow = el.shadowRoot;
      hideShellChrome(shadow);
      const cv = shadow?.querySelector('canvas');
      if (cv) cv.style.visibility = 'hidden';
      injectStyle(
        shadow,
        await (await fetch('/fonts/visual-fonts.css')).text() +
          `\n:host,.dom,.dve-print-line,.dve-print-line span{font-family:"Liberation Sans",Arial,sans-serif!important}`,
        'font-pin',
      );
      if (el.document) {
        const dpr = window.devicePixelRatio || 1;
        const w = el.clientWidth || width;
        const h = el.clientHeight || height;
        const canvas = shadow?.querySelector('canvas');
        if (canvas) {
          canvas.width = Math.max(1, (w * dpr) | 0);
          canvas.height = Math.max(1, (h * dpr) | 0);
        }
        el.document.pushEvent({
          kind: 6,
          time_ms: performance.now(),
          width: w,
          height: h,
          dpr,
        });
      }
      await waitFonts();
      let painted = false;
      for (let i = 0; i < 80; i++) {
        await waitFrames(2);
        const msg = shadow?.querySelector('.msg');
        if (msg && !msg.hidden && msg.textContent) {
          throw new Error(`nitro-docx: ${msg.textContent}`);
        }
        if (el.document) await el.document.tick();
        const page = shadow?.querySelector('.dve-print-page');
        if (page) {
          painted = true;
          break;
        }
      }
      if (!painted) throw new Error('nitro-docx: no print layout paint');
      for (let i = 0; i < 12; i++) {
        if (el.document) await el.document.tick();
        await waitFrames(1);
      }
      hideShellChrome(shadow);
      await waitFrames(3);
    }

    async function mountTs() {
      const { mountDocxPrintLayout } = await import('/out/bundles/docx-print.js');
      const res = await fetch(fixture);
      if (!res.ok) throw new Error(`fixture fetch ${res.status}`);
      const bytes = new Uint8Array(await res.arrayBuffer());
      await waitFonts();
      const { pageCount } = await mountDocxPrintLayout(stage, bytes);
      if (!pageCount) throw new Error('docx-print: empty layout');
      // After mount: mountDocxPrintLayout replaceChildren would wipe a pre-mount pin.
      injectStyle(
        stage,
        await (await fetch('/fonts/visual-fonts.css')).text() +
          `\n.dve-print-line,.dve-print-line span{font-family:"Liberation Sans",Arial,sans-serif!important}`,
        'font-pin',
      );
      await waitFonts();
      await waitFrames(4);
    }

    try {
      if (!fixture) throw new Error('missing fixture query param');
      await waitFonts();
      if (side === 'rust') await mountRust();
      else if (side === 'ts') await mountTs();
      else throw new Error(`unknown side ${side}`);
      stage.dataset.ready = '1';
      document.title = `ready:${id}:${side}`;
    } catch (e) {
      stage.dataset.ready = 'err';
      stage.textContent = String(e && e.stack ? e.stack : e);
      document.title = `error:${e}`;
    }
  </script>
</body>
</html>
