# SPDX-License-Identifier: MIT
[package]
name = "scoreboard-umya"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
umya-spreadsheet = "=3.1.0"
wasm-bindgen = "=0.2.129"
# umya-spreadsheet -> rand -> getrandom 0.4 needs its documented "wasm_js" backend on
# wasm32-unknown-unknown (https://docs.rs/getrandom/0.4.3/#webassembly-support).
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
