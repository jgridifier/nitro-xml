<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>nitro-xml xlsx viewer host</title>
  <link rel="stylesheet" href="/fonts/visual-fonts.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #stage {
      position: relative;
      overflow: hidden;
      background: #fff;
      font-family: "Liberation Sans", Arial, sans-serif;
    }
    /* ShellViewerElement (#149) needs flex column so .v can flex:1 when .chrome is hidden. */
    #stage nitro-xlsx {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    #stage xlsx-editor {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Upstream editor chrome attrs; tabs/status also hidden in JS after mount. */
    #stage xlsx-editor {
      --xve-title-bar-display: none;
    }
    @media print {
      html, body, #stage { background: #fff; }
      @page { margin: 0; }
    }
  </style>
</head>
<body>
  <div id="stage" data-ready="0"></div>
  <script type="module">
    import { GRID_CSS } from '../xlsx-grid-css.js';

    const params = new URLSearchParams(location.search);
    const side = params.get('side'); // ts = upstream xlsx-editor, rust = nitro-xlsx
    const id = params.get('id');
    const fixture = params.get('fixture'); // /repo/... path
    const width = Number(params.get('width') || 800);
    const height = Number(params.get('height') || 480);
    const stage = document.getElementById('stage');
    stage.style.width = `${width}px`;
    stage.style.height = `${height}px`;

    function waitFrames(n = 2) {
      return new Promise((resolve) => {
        let left = n;
        const step = () => {
          left -= 1;
          if (left <= 0) resolve();
          else requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    async function waitFonts() {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      // Touch the pinned faces so measureText uses them.
      try {
        await Promise.all([
          document.fonts.load('14px "Liberation Sans"'),
          document.fonts.load('bold 14px "Liberation Sans"'),
          document.fonts.load('14px Calibri'),
          document.fonts.load('14px Arial'),
          document.fonts.load('14px "Segoe UI"'),
        ]);
      } catch {
        /* ignore */
      }
    }

    function injectStyle(root, cssText, id) {
      if (!root) return;
      let el = root.querySelector(`style[data-visual="${id}"]`);
      if (!el) {
        el = document.createElement('style');
        el.dataset.visual = id;
        root.appendChild(el);
      }
      el.textContent = cssText;
    }

    function hideShellChrome(root) {
      if (!root) return;
      for (const sel of [
        '.chrome',
        '[part="sheet-tabs"]',
        '[part="status-bar"]',
        '.xve-tabs-row',
        '.xve-status',
        '.xve-title-bar',
        '.xve-ribbon',
        'office-ui-title-bar',
        'office-ui-status-bar',
      ]) {
        root.querySelectorAll(sel).forEach((node) => {
          node.style.display = 'none';
        });
      }
      // With .chrome removed from flow, keep the paint surface filling the host.
      const v = root.querySelector('.v');
      if (v) {
        v.style.flex = '1 1 auto';
        v.style.minHeight = '0';
        v.style.height = '100%';
      }
    }

    async function mountRust() {
      const { defineNitroXlsx, initCore } = await import('/repo/packages/nitro-xml/loader/index.js');
      // #121: CSS2 mirror → Liberation Sans files under /out/fonts/ (same as TS page).
      const fontMirror = new URL('/out/fonts/css2', location.origin).href;
      await initCore({ fontSource: fontMirror });
      defineNitroXlsx();
      const el = document.createElement('nitro-xlsx');
      el.setAttribute('readonly', '');
      stage.appendChild(el);
      el.style.width = '100%';
      el.style.height = '100%';
      await el.loadUrl(fixture);
      const shadow = el.shadowRoot;
      hideShellChrome(shadow);
      // Visual-only GRID_CSS (not shipped in loader — bundle budget).
      injectStyle(shadow, GRID_CSS, 'grid-css');
      injectStyle(
        shadow,
        await (await fetch('/fonts/visual-fonts.css')).text() +
          `\n:host,.xg-root,*{font-family:"Liberation Sans",Arial,sans-serif!important}`,
        'font-pin',
      );
      if (el.document) {
        const dpr = window.devicePixelRatio || 1;
        const w = el.clientWidth || width;
        const h = el.clientHeight || height;
        const canvas = shadow?.querySelector('canvas');
        if (canvas) {
          canvas.width = Math.max(1, (w * dpr) | 0);
          canvas.height = Math.max(1, (h * dpr) | 0);
        }
        el.document.pushEvent({
          kind: 6,
          time_ms: performance.now(),
          width: w,
          height: h,
          dpr,
        });
      }
      await waitFonts();
      let painted = false;
      for (let i = 0; i < 60; i++) {
        await waitFrames(2);
        const msg = shadow?.querySelector('.msg');
        if (msg && !msg.hidden && msg.textContent) {
          throw new Error(`nitro-xlsx: ${msg.textContent}`);
        }
        if (el.document) await el.document.tick();
        const dom = shadow?.querySelector('.dom');
        if (dom && dom.childElementCount > 0) {
          painted = true;
          break;
        }
      }
      if (!painted) throw new Error('nitro-xlsx: no grid paint');
      for (let i = 0; i < 6; i++) {
        if (el.document) await el.document.tick();
        await waitFrames(1);
      }
      hideShellChrome(shadow);
      await waitFrames(3);
    }

    async function mountTs() {
      const { defineXlsxEditor } = await import('/out/bundles/xlsx-editor.js');
      defineXlsxEditor();
      const el = document.createElement('xlsx-editor');
      el.setAttribute('read-only', '');
      el.setAttribute('show-toolbar', 'false');
      el.setAttribute('show-formula-bar', 'false');
      el.setAttribute('file-name', fixture.split('/').pop() || 'book.xlsx');
      stage.appendChild(el);
      await waitFrames(1);
      const res = await fetch(fixture);
      if (!res.ok) throw new Error(`fixture fetch ${res.status}`);
      const bytes = new Uint8Array(await res.arrayBuffer());
      await el.load(bytes, el.fileName);
      const root = el.shadowRoot || el;
      hideShellChrome(root);
      // Same Liberation Sans pin inside the editor shadow (adopted stylesheets / inject).
      injectStyle(
        root,
        await (await fetch('/fonts/visual-fonts.css')).text() +
          `\n:host,.xve-grid-host,.xg-root{font-family:"Liberation Sans",Arial,sans-serif!important}`,
        'font-pin',
      );
      await waitFonts();
      for (let i = 0; i < 60; i++) {
        await waitFrames(1);
        const grid = root.querySelector('.xve-grid-host');
        if (grid && grid.childElementCount > 0) break;
      }
      hideShellChrome(root);
      await waitFrames(3);
    }

    try {
      if (!fixture) throw new Error('missing fixture query param');
      await waitFonts();
      if (side === 'rust') await mountRust();
      else if (side === 'ts') await mountTs();
      else throw new Error(`unknown side ${side}`);
      stage.dataset.ready = '1';
      document.title = `ready:${id}:${side}`;
    } catch (e) {
      stage.dataset.ready = 'err';
      stage.textContent = String(e && e.stack ? e.stack : e);
      document.title = `error:${e}`;
    }
  </script>
</body>
</html>
