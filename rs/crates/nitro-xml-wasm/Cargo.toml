[package]
name = "nitro-xml-wasm"
description = "Nitro XML WebAssembly boundary (the only wasm-bindgen crate)"
version.workspace = true
edition.workspace = true
# Ported chrome (shortcuts/ribbon) and clipboard-text helpers are Apache-2.0; see PROVENANCE.md.
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Synthetic grids and serde/JSON export arms for perf/micro only.
# Never enabled for the shipped package (`scripts/build-wasm.sh` default).
bench = ["dep:serde", "dep:serde-wasm-bindgen"]

[dependencies]
nitro-xml.workspace = true
nitro-xml-render.workspace = true
nitro-xml-xlsx.workspace = true
nitro-xml-docx.workspace = true
nitro-xml-pptx.workspace = true
wasm-bindgen.workspace = true
js-sys = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
unicode-segmentation = "1"
unicode-bidi = "0.3"
# Debug builds only (the hook is behind cfg(debug_assertions) and stripped from release by LTO).
console_error_panic_hook = "0.1.7"

# wasm-pack runs wasm-opt after the release build (PRODUCT_SPEC.md §5: opt-level 3, LTO,
# codegen-units 1, then wasm-opt -O1 — Jared 2026-10-20). Keep `--one-caller-inline-max-function-size=1500`
# from #352 so large single-caller bodies stay out of the first-open TurboFan zone
# (docs/perf-rust-hotpaths.md slice 4). Feature flags match .cargo/config.toml (SIMD on).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1", "--one-caller-inline-max-function-size=1500", "--enable-simd", "--enable-bulk-memory", "--enable-sign-ext", "--enable-reference-types", "--enable-multivalue", "--enable-mutable-globals", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
