# Thin skeleton: every job checks out, (optionally) restores a tools cache, and runs ONE repo script.
# Logic lives in scripts/ci/*. Agents must not edit this file (see AGENTS.md); ask Jared for YAML changes.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/rust.sh
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/wasm.sh
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/licenses.sh
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/parity.sh
      - name: Upload visual parity diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-diffs
          path: |
            parity/visual/out/diffs/
            parity/visual/out/summary.txt
          if-no-files-found: ignore
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.nitro-tools
          key: nitro-tools-${{ runner.os }}-${{ hashFiles('scripts/ci/versions.env', 'tools/**') }}
      - run: bash scripts/ci/roundtrip.sh
  edit-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/edit_parity.sh
  undo-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/undo_parity.sh
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/a11y.sh
  ime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/ime.sh
  bidi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/bidi.sh
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/spellcheck.sh
  ship-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/ship_check.sh
  selection-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/selection_parity.sh
  crash-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/ci/crash_recovery.sh
