[package]
name = "nitro-xml-pptx"
description = "Nitro XML .pptx model (port of ChristopherVR/ooxml)"
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
nitro-xml-opc.workspace = true
nitro-xml-render.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[dev-dependencies]
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[example]]
name = "pptx_dump"
path = "examples/pptx_dump.rs"

[[example]]
name = "pptx_view_ir_dump"
path = "examples/pptx_view_ir_dump.rs"

[[example]]
name = "pptx_save"
path = "examples/pptx_save.rs"
