# SPDX-License-Identifier: MIT
[package]
name = "nitro-xml-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[lib]
name = "nitro_xml_edit_fuzz"
path = "edit_common.rs"
test = false
doctest = false

[features]
default = []
# Enable for `cargo fuzz run edit_*` (needs a C++ toolchain + nightly).
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
serde_json = "1"
nitro-xml-opc = { path = "../crates/nitro-xml-opc" }
nitro-xml-xlsx = { path = "../crates/nitro-xml-xlsx" }
nitro-xml-docx = { path = "../crates/nitro-xml-docx" }
nitro-xml-pptx = { path = "../crates/nitro-xml-pptx" }

# Isolate from the parent workspace so cargo-fuzz can use nightly independently.
[workspace]
members = ["."]
resolver = "2"

[[bin]]
name = "xml_parse"
path = "fuzz_targets/xml_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_open"
path = "fuzz_targets/zip_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opc_open"
path = "fuzz_targets/opc_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_load"
path = "fuzz_targets/xlsx_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_load"
path = "fuzz_targets/docx_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pptx_load"
path = "fuzz_targets/pptx_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safe_href"
path = "fuzz_targets/safe_href.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_xlsx"
path = "fuzz_targets/edit_xlsx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_docx"
path = "fuzz_targets/edit_docx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_pptx"
path = "fuzz_targets/edit_pptx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit_ci"
path = "fuzz_targets/edit_ci.rs"
test = false
doc = false
bench = false
