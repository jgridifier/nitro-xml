<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>nitro-xml pptx viewer host</title>
  <link rel="stylesheet" href="/fonts/visual-fonts.css" />
  <script type="importmap">
  {"imports":{"emf-converter":"/repo/parity/visual/node_modules/emf-converter/dist/browser.mjs"}}
  </script>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #stage {
      position: relative;
      overflow: hidden;
      background: #fff;
      font-family: "Liberation Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* ShellViewerElement needs flex column so .v can flex:1 when .chrome is hidden. */
    #stage nitro-pptx {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    #ts-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #fff;
      font-family: "Liberation Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @media print {
      html, body, #stage { background: #fff; }
      @page { margin: 0; }
    }
  </style>
</head>
<body>
  <div id="stage" data-ready="0"></div>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const side = params.get('side'); // ts = upstream slide stage, rust = nitro-pptx
    const id = params.get('id');
    const fixture = params.get('fixture'); // /repo/... path
    const slideIndex = Math.max(0, Number(params.get('slide') || 0) | 0);
    const width = Number(params.get('width') || 960);
    const height = Number(params.get('height') || 540);
    const stage = document.getElementById('stage');
    stage.style.width = `${width}px`;
    stage.style.height = `${height}px`;

    function waitFrames(n = 2) {
      return new Promise((resolve) => {
        let left = n;
        const step = () => {
          left -= 1;
          if (left <= 0) resolve();
          else requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    async function waitFonts() {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      try {
        await Promise.all([
          ...[...document.fonts].map((face) => face.load().catch(() => {})),
          document.fonts.load('18px "Liberation Sans"'),
          document.fonts.load('bold 18px "Liberation Sans"'),
          document.fonts.load('18px Calibri'),
          document.fonts.load('18px Carlito'),
          document.fonts.load('18px Arial'),
          document.fonts.load('18px "Segoe UI"'),
        ]);
      } catch {
        /* ignore */
      }
    }

    function injectStyle(root, cssText, id) {
      if (!root) return;
      let el = root.querySelector(`style[data-visual="${id}"]`);
      if (!el) {
        el = document.createElement('style');
        el.dataset.visual = id;
        root.appendChild(el);
      }
      el.textContent = cssText;
    }

    function fitScale(canvasW, canvasH, viewW, viewH) {
      if (viewW <= 0 || viewH <= 0) return 1;
      return Math.min(viewW / Math.max(1, canvasW), viewH / Math.max(1, canvasH), 1);
    }

    async function mountRust() {
      const { defineNitroPptx, initCore } = await import('/repo/packages/nitro-xml/loader/index.js');
      // #121: CSS2 mirror → Liberation Sans under /out/fonts/ (same as xlsx visual host).
      const fontMirror = new URL('/out/fonts/css2', location.origin).href;
      await initCore({ fontSource: fontMirror });
      defineNitroPptx();
      // Metric tracking is measured on the first tick; load the pinned faces first (TS
      // measures after its DOM already triggered them).
      await waitFonts();
      const el = document.createElement('nitro-pptx');
      el.setAttribute('readonly', '');
      el.style.width = '100%';
      el.style.height = '100%';
      stage.appendChild(el);
      await el.loadUrl(fixture);
      await waitFonts();
      const shadow = el.shadowRoot;
      // Hide Stage-6 shell chrome so the shot is the slide surface only.
      const chrome = shadow?.querySelector('.chrome');
      if (chrome) chrome.style.display = 'none';
      const v = shadow?.querySelector('.v');
      if (v) {
        v.style.flex = '1 1 auto';
        v.style.minHeight = '0';
        v.style.height = '100%';
      }
      // Pin Latin defaults without !important on every descendant so authored
      // CJK faces (黑体 / Microsoft YaHei → Droid alias) can win (bug64693).
      injectStyle(
        shadow,
        await (await fetch('/fonts/visual-fonts.css')).text() +
          `\n:host,.dom{font-family:"Liberation Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}` +
          `\n.dom [data-pptx-element]{font-family:"Liberation Sans",Arial,sans-serif}`,
        'font-pin',
      );
      await waitFonts();
      // Advance via keyboard (ArrowRight) — same path as the viewer; no loader API growth.
      if (el.document && slideIndex > 0) {
        for (let s = 0; s < slideIndex; s++) {
          el.document.pushEvent({
            kind: 4, // EventKind.Keyboard
            time_ms: performance.now(),
            key: 'ArrowRight',
            code: 'ArrowRight',
            type: 0,
            mods: 0,
          });
          await el.document.tick();
          await waitFrames(1);
        }
      }
      if (el.document) {
        const dpr = window.devicePixelRatio || 1;
        const w = el.clientWidth || width;
        const h = el.clientHeight || height;
        const canvas = shadow?.querySelector('canvas');
        if (canvas) {
          canvas.width = Math.max(1, (w * dpr) | 0);
          canvas.height = Math.max(1, (h * dpr) | 0);
        }
        el.document.pushEvent({
          kind: 6, // EventKind.Resize
          time_ms: performance.now(),
          width: w,
          height: h,
          dpr,
        });
      }
      let painted = false;
      for (let i = 0; i < 90; i++) {
        await waitFrames(2);
        const msg = shadow?.querySelector('.msg');
        if (msg && !msg.hidden && msg.textContent) {
          throw new Error(`nitro-pptx: ${msg.textContent}`);
        }
        if (el.document) {
          await el.document.tick();
        }
        const dom = shadow?.querySelector('.dom');
        if (dom && dom.childElementCount > 0) {
          painted = true;
          break;
        }
      }
      if (!painted) throw new Error('nitro-pptx: no slide DOM paint');
      // spAutoFit + GDI/hang-space: drain batched measureText before capture (#27).
      for (let c = 0; c < 48; c++) {
        if (el.document) await el.document.tick();
        await waitFrames(1);
        if ((el.document?.measureCount | 0) === 0 && c >= 11) break;
      }
      // EMF/WMF: loader converts `nitro-metafile:` src asynchronously (#27).
      for (let c = 0; c < 40; c++) {
        const pending = shadow?.querySelector('img[src^="nitro-metafile:"]');
        if (!pending) break;
        if (el.document) await el.document.tick();
        await waitFrames(2);
      }
      // Native `<video>` / `<audio controls>`: let metadata paint transport before capture (#27).
      for (let c = 0; c < 24; c++) {
        const media = shadow?.querySelectorAll('video,audio');
        if (!media?.length) break;
        let settled = true;
        for (const v of media) {
          if (v.readyState < 1) settled = false;
        }
        if (settled && c >= 4) break;
        if (el.document) await el.document.tick();
        await waitFrames(2);
      }
      await waitFonts();
      await waitFrames(3);
    }

    async function mountTs() {
      await waitFonts();
      const {
        loadPresentation,
        renderSlideStage,
        createDefaultRegistry,
        createTranslator,
      } = await import('/out/bundles/pptx-slide.js');
      const res = await fetch(fixture);
      if (!res.ok) throw new Error(`fixture fetch ${res.status}`);
      const buffer = await res.arrayBuffer();
      const loaded = await loadPresentation(buffer);
      try {
        if (!loaded.slides?.length) throw new Error('upstream: empty slides');
        const idx = Math.min(slideIndex, loaded.slides.length - 1);
        const scale = fitScale(
          loaded.canvasSize.width,
          loaded.canvasSize.height,
          width,
          height,
        );
        const slideEl = renderSlideStage({
          document,
          slide: loaded.slides[idx],
          canvasSize: loaded.canvasSize,
          mediaDataUrls: loaded.mediaDataUrls,
          colorScheme: loaded.colorScheme,
          fontScheme: loaded.fontScheme,
          tableStyleMap: loaded.tableStyleMap,
          registry: createDefaultRegistry(),
          t: createTranslator('en'),
          scale,
          slides: loaded.slides,
          currentSlideIndex: idx,
          reading: true,
        });
        const wrap = document.createElement('div');
        wrap.id = 'ts-wrap';
        wrap.appendChild(slideEl);
        stage.appendChild(wrap);
        injectStyle(
          document.head,
          await (await fetch('/fonts/visual-fonts.css')).text() +
            `\n#ts-wrap{font-family:"Liberation Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}` +
            `\n#ts-wrap .pptxv-element{font-family:"Liberation Sans",Arial,sans-serif}`,
          'font-pin-ts',
        );
        await waitFrames(3);
        await waitFonts();
        await waitFrames(3);
      } finally {
        // Keep blob URLs alive for the screenshot; dispose handler only.
        loaded.handler?.dispose?.();
      }
    }

    try {
      if (!fixture) throw new Error('missing fixture query param');
      if (side === 'rust') await mountRust();
      else if (side === 'ts') await mountTs();
      else throw new Error(`unknown side ${side}`);
      stage.dataset.ready = '1';
      document.title = `ready:${id}:${side}`;
    } catch (e) {
      stage.dataset.ready = 'err';
      stage.textContent = String(e && e.stack ? e.stack : e);
      document.title = `error:${e}`;
    }
  </script>
</body>
</html>
