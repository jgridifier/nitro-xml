[package]
name = "nitro-xml-opc"
description = "Nitro XML shared foundation: zip, XML, OPC and DrawingML"
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
# `unreserved` allows raw_copy of Info-ZIP Unix (0x7875) and other common extra fields
# present in real-world OOXML packages (#65 touch-rebuild carry).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "unreserved"] }
quick-xml = "0.41"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[dev-dependencies]
sha2 = "0.10"
crc32fast = "1"
