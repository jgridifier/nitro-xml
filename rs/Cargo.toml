# Nitro XML Rust workspace.
# Crates: nitro-xml-opc, nitro-xml-render, nitro-xml-xlsx, nitro-xml-docx, nitro-xml-pptx,
# nitro-xml-wasm, umbrella nitro-xml.
[workspace]
resolver = "2"
members = [
    "crates/nitro-xml-opc",
    "crates/nitro-xml-render",
    "crates/nitro-xml-xlsx",
    "crates/nitro-xml-docx",
    "crates/nitro-xml-pptx",
    "crates/nitro-xml-wasm",
    "crates/nitro-xml",
    "crates/nitro-xml-py",
]
# cargo-fuzz nest (nightly + libFuzzer); has its own [workspace] in fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
license = "MIT"   # default for crates with only original files; a crate containing ported upstream files sets `license = "MIT AND Apache-2.0"` itself (see AGENTS.md §6, PROVENANCE.md)
repository = "https://github.com/jgridifier/nitro-xml"
homepage = "https://jgridifier.github.io/nitro-xml/"
documentation = "https://docs.rs/nitro-xml"
edition = "2021"
version = "0.1.0"
publish = false
keywords = ["ooxml", "office", "openxml", "xlsx", "docx", "pptx", "spreadsheet"]
categories = ["parser-implementations", "encoding"]

# `upstream/` (ChristopherVR/ooxml submodule) is test and bench only and lives
# outside rs/, so no crate package can include it.
[workspace.dependencies]
nitro-xml-opc = { version = "0.1.0", path = "crates/nitro-xml-opc" }
nitro-xml-render = { version = "0.1.0", path = "crates/nitro-xml-render" }
nitro-xml-xlsx = { version = "0.1.0", path = "crates/nitro-xml-xlsx" }
nitro-xml-docx = { version = "0.1.0", path = "crates/nitro-xml-docx" }
nitro-xml-pptx = { version = "0.1.0", path = "crates/nitro-xml-pptx" }
nitro-xml = { version = "0.1.0", path = "crates/nitro-xml" }
nitro-xml-wasm = { version = "0.1.0", path = "crates/nitro-xml-wasm" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
