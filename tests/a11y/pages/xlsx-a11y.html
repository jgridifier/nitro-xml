<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>nitro-xml xlsx a11y host</title>
  <link rel="stylesheet" href="/fonts/visual-fonts.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #fff; }
    #stage {
      position: relative;
      overflow: hidden;
      background: #fff;
      font-family: "Liberation Sans", Arial, sans-serif;
    }
    #stage nitro-xlsx {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    #stage xlsx-editor {
      display: block;
      width: 100%;
      height: 100%;
      --xve-title-bar-display: none;
    }
  </style>
</head>
<body>
  <div id="stage" data-ready="0"></div>
  <script type="module">
    import { GRID_CSS } from '/repo/parity/visual/xlsx-grid-css.js';

    const params = new URLSearchParams(location.search);
    const side = params.get('side');
    const id = params.get('id');
    const fixture = params.get('fixture');
    const width = Number(params.get('width') || 800);
    const height = Number(params.get('height') || 480);
    const editMode = params.get('edit') === '1';
    const stage = document.getElementById('stage');
    stage.style.width = `${width}px`;
    stage.style.height = `${height}px`;

    function waitFrames(n = 2) {
      return new Promise((resolve) => {
        let left = n;
        const step = () => {
          left -= 1;
          if (left <= 0) resolve();
          else requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    async function waitFonts() {
      if (document.fonts?.ready) await document.fonts.ready;
    }

    function injectStyle(root, cssText, id) {
      if (!root) return;
      let el = root.querySelector(`style[data-a11y="${id}"]`);
      if (!el) {
        el = document.createElement('style');
        el.dataset.a11y = id;
        root.appendChild(el);
      }
      el.textContent = cssText;
    }

    function applyLightTheme(host) {
      if (!host?.style) return;
      const t = {
        '--xve-header-bg': '#f5f5f5',
        '--xve-header-fg': '#444444',
        '--xve-header-active-bg': '#d3e9dc',
        '--xve-selection': 'rgb(33 115 70 / 0.12)',
        '--xve-selection-border': '#217346',
        '--xve-sheet-bg': '#ffffff',
        '--xve-grid-line': '#e1e1e1',
      };
      for (const [k, v] of Object.entries(t)) host.style.setProperty(k, v);
    }

    /** Hide editor-only chrome; keep sheet tabs for AX/keyboard parity with nitro tabs. */
    function hideEditorChrome(root) {
      if (!root) return;
      for (const sel of [
        '.xve-title-bar',
        '.xve-ribbon',
        'office-ui-title-bar',
        '[part="status-bar"]',
        '.xve-status',
        'office-ui-status-bar',
      ]) {
        root.querySelectorAll(sel).forEach((node) => {
          node.style.display = 'none';
        });
      }
    }

    async function mountRust() {
      const { defineNitroXlsx, initCore, loadEditorModule } = await import('/repo/packages/nitro-xml/loader/index.js');
      const fontMirror = new URL('/out/fonts/css2', location.origin).href;
      await initCore({ fontSource: fontMirror });
      if (editMode) await loadEditorModule();
      defineNitroXlsx();
      const el = document.createElement('nitro-xlsx');
      // Absence of the attribute still means readonly (loader default); edit mode needs "false".
      el.setAttribute('readonly', editMode ? 'false' : '');
      applyLightTheme(el);
      stage.appendChild(el);
      el.style.width = '100%';
      el.style.height = '100%';
      await el.loadUrl(fixture);
      const shadow = el.shadowRoot;
      const cv = shadow?.querySelector('canvas');
      if (cv) cv.style.visibility = 'hidden';
      injectStyle(shadow, GRID_CSS, 'grid-css');
      if (el.document) {
        const dpr = window.devicePixelRatio || 1;
        const w = el.clientWidth || width;
        const h = el.clientHeight || height;
        el.document.pushEvent({
          kind: 6,
          time_ms: performance.now(),
          width: w,
          height: h,
          dpr,
        });
      }
      await waitFonts();
      let painted = false;
      for (let i = 0; i < 60; i++) {
        await waitFrames(2);
        const msg = shadow?.querySelector('.msg');
        if (msg && !msg.hidden && msg.textContent) {
          throw new Error(`nitro-xlsx: ${msg.textContent}`);
        }
        if (el.document) await el.document.tick();
        const grid = shadow?.querySelector('[role="grid"]');
        if (grid) {
          painted = true;
          break;
        }
        const dom = shadow?.querySelector('.dom');
        if (dom && dom.childElementCount > 0) {
          painted = true;
          break;
        }
      }
      if (!painted) throw new Error('nitro-xlsx: no grid paint');
      for (let i = 0; i < 4; i++) {
        if (el.document) await el.document.tick();
        await waitFrames(1);
      }
      window.__a11yHost = el;
    }

    async function mountTs() {
      const { defineXlsxEditor } = await import('/out/bundles/xlsx-editor.js');
      defineXlsxEditor();
      const el = document.createElement('xlsx-editor');
      el.setAttribute('read-only', '');
      el.setAttribute('show-toolbar', 'false');
      el.setAttribute('show-formula-bar', 'false');
      el.setAttribute('file-name', fixture.split('/').pop() || 'book.xlsx');
      applyLightTheme(el);
      stage.appendChild(el);
      await waitFrames(1);
      const res = await fetch(fixture);
      if (!res.ok) throw new Error(`fixture fetch ${res.status}`);
      const bytes = new Uint8Array(await res.arrayBuffer());
      await el.load(bytes, el.fileName);
      const root = el.shadowRoot || el;
      hideEditorChrome(root);
      await waitFonts();
      for (let i = 0; i < 60; i++) {
        await waitFrames(1);
        if (root.querySelector('[role="grid"]')) break;
      }
      if (!root.querySelector('[role="grid"]')) throw new Error('xlsx-editor: no role=grid');
      await waitFrames(3);
      window.__a11yHost = el;
    }

    try {
      if (!fixture) throw new Error('missing fixture query param');
      await waitFonts();
      if (side === 'rust') await mountRust();
      else if (side === 'ts') await mountTs();
      else throw new Error(`unknown side ${side}`);
      stage.dataset.ready = '1';
      document.title = `ready:${id}:${side}`;
    } catch (e) {
      stage.dataset.ready = 'err';
      stage.textContent = String(e && e.stack ? e.stack : e);
      document.title = `error:${e}`;
    }
  </script>
</body>
</html>
