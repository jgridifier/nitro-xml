[package]
name = "nitro-xml-render"
description = "Nitro XML shared render crate: command buffer, measure/layout read-back, primitives, chart (S1), SmartArt (S2), metafile (S3)"
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
nitro-xml-opc = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

[features]
# Kept for downstream callers that still gate on the feature name; S1 is always on (#28).
chart-rust-s1 = []
default = ["chart-rust-s1"]

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "unreserved"] }
