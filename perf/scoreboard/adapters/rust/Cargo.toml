# SPDX-License-Identifier: MIT
# Scoreboard-only wasm-bindgen shims around Rust competitors (test/bench only, never shipped).
# Own workspace on purpose: not a member of rs/.
[workspace]
resolver = "2"
members = [
    "calamine-shim",
    "umya-shim",
    "docx-rs-shim",
    "nitro-xlsx-shim",
    "nitro-docx-shim",
    "nitro-pptx-shim",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
