[package]
name = "nitro-xml-docx"
description = "Nitro XML .docx model (port of ChristopherVR/ooxml)"
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
nitro-xml-opc.workspace = true
nitro-xml-render.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
unicode-bidi = "0.3"
unicode-segmentation = "1"

[[example]]
name = "docx_styles_dump"
path = "examples/docx_styles_dump.rs"

[[example]]
name = "docx_layout_dump"
path = "examples/docx_layout_dump.rs"

[[example]]
name = "docx_pagecount_dump"
path = "examples/docx_pagecount_dump.rs"
