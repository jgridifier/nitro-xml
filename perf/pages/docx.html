<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nitro XML — docx viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px system-ui, sans-serif;
      }
      header {
        display: flex;
        gap: 1rem;
        align-items: center;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid #ddd;
      }
      nitro-docx {
        display: block;
        height: calc(100% - 3rem);
      }
    </style>
  </head>
  <body>
    <header>
      <label>
        Open
        <input type="file" id="pick" accept=".docx,.docm,.dotx,.dotm" />
      </label>
      <span id="hint">Arrow keys change pages. Set <code>?src=</code> to a fixture URL.</span>
    </header>
    <nitro-docx readonly id="viewer" tabindex="0"></nitro-docx>
    <script type="module">
      import { defineNitroDocx } from "../../packages/nitro-xml/loader/index.js";

      defineNitroDocx();
      const viewer = document.getElementById("viewer");
      const pick = document.getElementById("pick");
      pick.addEventListener("change", () => {
        const f = pick.files && pick.files[0];
        if (f) viewer.loadFile(f).catch(console.error);
      });
      const params = new URLSearchParams(location.search);
      const src = params.get("src");
      if (src) viewer.loadUrl(src).catch(console.error);
    </script>
  </body>
</html>
