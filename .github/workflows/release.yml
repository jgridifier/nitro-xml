# Release to npm, crates.io and PyPI on a v* tag.
# Default: DRY_RUN=1 (pack / publish -n only). Set repository variable
# RELEASE_DRY_RUN=false for a real publish after secrets + trusted publishers exist.
#
# Agents normally do not edit workflows (AGENTS.md); this file was added for the
# explicit publishing workstream. Logic lives in scripts/ci/release_publish.sh.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (no uploads)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # npm provenance + PyPI trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Decide dry-run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then echo "dry=1" >> "$GITHUB_OUTPUT"
            else echo "dry=0" >> "$GITHUB_OUTPUT"; fi
          else
            # Tags default to dry-run unless repo variable RELEASE_DRY_RUN=false
            if [ "${{ vars.RELEASE_DRY_RUN }}" = "false" ]; then echo "dry=0" >> "$GITHUB_OUTPUT"
            else echo "dry=1" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust
        run: |
          # toolchain from rust-toolchain.toml
          rustup show

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish (DRY_RUN=${{ steps.mode.outputs.dry }})
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/ci/release_publish.sh
